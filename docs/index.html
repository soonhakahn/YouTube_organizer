<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7c3aed" />
  <title>YouTube Organizer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root { --bg:#0b1020; --card:#141a2e; --muted:#a9b4d0; --txt:#eef2ff; --accent:#7c3aed; --accent2:#22c55e; }
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 400px at 20% 10%, rgba(124,58,237,.35), transparent), linear-gradient(135deg,#070a14,#0b1020);color:var(--txt)}
    .wrap{max-width:820px;margin:0 auto;padding:18px}
    .hero{background:linear-gradient(135deg, rgba(124,58,237,.85), rgba(30,41,59,.85));border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
    .hero h1{margin:0 0 6px;font-size:22px;letter-spacing:.2px}
    .hero p{margin:0;color:rgba(255,255,255,.85);font-size:13px}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{appearance:none;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:11px 14px;background:rgba(255,255,255,.06);color:var(--txt);font-weight:700;cursor:pointer}
    .btn.primary{background:rgba(124,58,237,.25);border-color:rgba(124,58,237,.35)}
    .btn.green{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.25)}
    .btn:active{transform:scale(.99)}
    .card{margin-top:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:14px}
    pre{white-space:pre-wrap;word-break:break-word;margin:0;color:var(--txt);font-size:13px;line-height:1.48}
    .meta{margin-top:8px;color:var(--muted);font-size:12px}
    a{color:#c4b5fd}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>YouTube Organizer</h1>
      <p>순학님 재생목록/Watch Later/좋아요 정리를 위한 전용 PWA (OAuth 연동 후 자동 업데이트)</p>
      <div class="row">
        <button class="btn primary" id="btnSummary">요약 불러오기</button>
        <button class="btn" id="btnClear">비우기</button>
        <button class="btn" id="btnCopy">복사</button>
      </div>
      <div class="meta" id="status">대기 중</div>
    </div>

    <div class="card">
      <pre id="out">(내용 없음)</pre>
      <div class="meta">
        데이터는 GitHub Raw에서 읽습니다. OAuth 토큰/민감정보는 절대 저장하지 않습니다.
      </div>
    </div>

    <div class="meta" style="margin-top:14px">
      소스: <a href="https://github.com/soonhakahn/YouTube_organizer" target="_blank" rel="noreferrer">YouTube_organizer</a>
    </div>
  </div>

  <script>
    const RAW_BASE = 'https://raw.githubusercontent.com/soonhakahn/YouTube_organizer/main';
    const URL_SUMMARY = RAW_BASE + '/reports/summary.md';

    const out = document.getElementById('out');
    const status = document.getElementById('status');
    let lastText = '';

    async function fetchText(url){
      status.textContent = '불러오는 중…';
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const txt = await res.text();
      status.textContent = '완료 (' + new Date().toLocaleString() + ')';
      return txt;
    }

    document.getElementById('btnSummary').onclick = async ()=>{
      try{ lastText = await fetchText(URL_SUMMARY); out.textContent = lastText || '(비어있음)'; }
      catch(e){ status.textContent = '실패: ' + e.message + ' (아직 OAuth/동기화 전일 수 있어요)'; }
    };

    document.getElementById('btnClear').onclick = ()=>{
      lastText = '';
      out.textContent = '(내용 없음)';
      status.textContent = '비움';
    };

    document.getElementById('btnCopy').onclick = async ()=>{
      try{ await navigator.clipboard.writeText(lastText || out.textContent); status.textContent='복사됨'; }
      catch(e){ status.textContent='복사 실패'; }
    };
  </script>
</body>
</html>
